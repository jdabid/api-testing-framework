[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: Critical smoke tests for core API availability and auth
    auth: JWT authentication and RBAC authorization tests
    crud: RESTful CRUD lifecycle tests (GET, POST, PUT, DELETE)
    contract: JSON schema contract validation tests using Pydantic
    bva: Boundary Value Analysis and negative edge-case tests

